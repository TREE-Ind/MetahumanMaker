name: Bug report
description: Report an installation, character workflow or native exchange problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Check the installation and troubleshooting guides first. Share a small, redistributable example; omit credentials, licensed character data, weights and private scans.
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: OS, Blender, add-on, Unreal, bridge and optional backend versions.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What were you trying to do, and what happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact action and the smallest useful reproduction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant errors and before/after images. For fit problems, include front/profile/back views. Redact private paths and identifying information.
